<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IRON FRAME - Action Proto</title>
<style>
body { margin:0; background:#1A1A2E; color:#E8E8F0; font-family:Arial,sans-serif; display:flex; flex-direction:column; align-items:center; }
canvas { border:2px solid #533483; background:#0F3460; box-shadow:0 0 20px rgba(83,52,131,0.4); }
#ui { display:flex; gap:20px; margin:10px; font-size:14px; }
.stat { color:#00f0ff; font-weight:bold; text-shadow:0 0 5px #00f0ff; }
#help { margin-top:6px; color:#8888AA; font-size:12px; }
</style>
</head>
<body>
<div id="ui">
  <div class="stat">HP: <span id="hp">100</span></div>
  <div class="stat">EN: <span id="en">50</span></div>
  <div class="stat">ATK: <span id="atk">10</span></div>
  <div class="stat">DEF: <span id="def">0</span></div>
  <div class="stat">SPD: <span id="spd">5</span></div>
  <div class="stat">PARTS: <span id="parts">0</span></div>
</div>
<canvas id="c" width="800" height="450"></canvas>
<div id="help">[←][→] 移動 / [↑] ジャンプ / [Z] 射撃 / 敵を倒してパーツを集めろ！</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let player = { x:100, y:300, w:24, h:36, vx:0, vy:0, hp:100, maxHp:100, en:50, maxEn:50, atk:10, def:0, spd:5, onGround:false, dir:1 };
let bullets = [];
let enemies = [];
let drops = [];
let particles = [];
let keys = {};
let frameCount = 0;
let partsCount = 0;

const GRAVITY = 0.6;
const GROUND = 386;

document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

function spawnEnemy() {
  let side = Math.random() < 0.5 ? -40 : canvas.width + 10;
  enemies.push({
    x: side, y: GROUND-32, w:32, h:32,
    vx: (side < 0 ? 1.2 : -1.2) * (0.9 + Math.random()*0.5),
    hp: 40 + Math.floor(Math.random()*30),
    maxHp: 40
  });
}

function spawnDrop(x, y) {
  const ranks = [
    { rank:'C', color:'#95a5a6', atk:0, def:3, spd:0, en:0 },
    { rank:'B', color:'#3498db', atk:5, def:5, spd:2, en:5 },
    { rank:'A', color:'#f1c40f', atk:12, def:8, spd:5, en:10 }
  ];
  const r = ranks[Math.floor(Math.random()*ranks.length)];
  drops.push({ x, y, w:18, h:18, vy: -5, life: 360, ...r });
}

function update() {
  // プレイヤー移動
  if (keys['ArrowLeft']) { player.vx = -(3 + player.spd*0.25); player.dir = -1; }
  else if (keys['ArrowRight']) { player.vx = (3 + player.spd*0.25); player.dir = 1; }
  else { player.vx *= 0.82; }

  if ((keys['ArrowUp'] || keys[' ']) && player.onGround) {
    player.vy = -13; player.onGround = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  if (player.y + player.h >= GROUND) {
    player.y = GROUND - player.h; player.vy = 0; player.onGround = true;
  }
  if (player.x < 0) player.x = 0;
  if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

  // 射撃 (Zキー)
  if ((keys['z'] || keys['Z']) && frameCount % 10 === 0) {
    bullets.push({
      x: player.x + player.w/2, y: player.y + 10,
      vx: 9 * player.dir, w:12, h:4
    });
  }

  // 弾丸更新
  for (let i = bullets.length-1; i>=0; i--) {
    let b = bullets[i];
    b.x += b.vx;
    if (b.x < -20 || b.x > canvas.width+20) bullets.splice(i,1);
  }

  // 敵更新
  if (frameCount % 140 === 0) spawnEnemy();
  for (let i = enemies.length-1; i>=0; i--) {
    let e = enemies[i];
    e.x += e.vx;
    if (e.x < -60 || e.x > canvas.width+60) { enemies.splice(i,1); continue; }

    // 弾丸衝突
    for (let j = bullets.length-1; j>=0; j--) {
      let b = bullets[j];
      if (b.x < e.x+e.w && b.x+b.w > e.x && b.y < e.y+e.h && b.y+b.h > e.y) {
        e.hp -= player.atk;
        bullets.splice(j,1);
        for(let k=0;k<4;k++) particles.push({
          x:e.x+e.w/2, y:e.y+e.h/2,
          vx:(Math.random()-0.5)*5, vy:(Math.random()-0.5)*5,
          life:18, color:'#ff007f', size:3
        });
        break;
      }
    }

    if (e.hp <= 0) {
      spawnDrop(e.x, e.y);
      enemies.splice(i,1);
      continue;
    }

    // プレイヤー衝突
    if (player.x < e.x+e.w && player.x+player.w > e.x && player.y < e.y+e.h && player.y+player.h > e.y) {
      let dmg = Math.max(6 - Math.floor(player.def/4), 1);
      player.hp -= dmg;
      for(let k=0;k<3;k++) particles.push({
        x:player.x+player.w/2, y:player.y+player.h/2,
        vx:(Math.random()-0.5)*3, vy:(Math.random()-0.5)*3,
        life:12, color:'#e74c3c', size:3
      });
      player.vx = (player.x < e.x ? -7 : 7);
      player.vy = -4;
    }
  }

  // ドロップ更新
  for (let i = drops.length-1; i>=0; i--) {
    let d = drops[i];
    d.vy += 0.35;
    d.y += d.vy;
    if (d.y + d.h >= GROUND) { d.y = GROUND - d.h; d.vy = -d.vy*0.4; }
    d.life--;
    if (d.life <= 0) { drops.splice(i,1); continue; }

    // 拾う
    if (player.x < d.x+d.w && player.x+player.w > d.x && player.y < d.y+d.h && player.y+player.h > d.y) {
      player.atk += d.atk;
      player.def += d.def;
      player.spd += d.spd;
      player.maxEn += d.en;
      partsCount++;
      drops.splice(i,1);
      for(let k=0;k<6;k++) particles.push({
        x:player.x+player.w/2, y:player.y,
        vx:(Math.random()-0.5)*4, vy:-2-Math.random()*3,
        life:25, color:'#ffd700', size:3
      });
    }
  }

  // パーティクル
  for (let i = particles.length-1; i>=0; i--) {
    let p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }

  // UI更新
  document.getElementById('hp').innerText = Math.max(0, Math.floor(player.hp)) + "/" + player.maxHp;
  document.getElementById('en').innerText = player.en + "/" + player.maxEn;
  document.getElementById('atk').innerText = player.atk;
  document.getElementById('def').innerText = player.def;
  document.getElementById('spd').innerText = player.spd;
  document.getElementById('parts').innerText = partsCount;

  frameCount++;
}

function draw() {
  ctx.fillStyle = '#0F3460';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 背景グリッド
  ctx.strokeStyle = 'rgba(0,240,255,0.06)';
  ctx.lineWidth = 1;
  for (let x=0; x<canvas.width; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
  for (let y=0; y<canvas.height; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

  // 地面
  ctx.fillStyle = '#1A1A2E';
  ctx.fillRect(0, GROUND, canvas.width, canvas.height-GROUND);
  ctx.strokeStyle = '#533483'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(canvas.width, GROUND); ctx.stroke();

  // プレイヤー（メカ）描画
  ctx.save();
  ctx.translate(player.x + player.w/2, player.y + player.h/2);
  if (player.dir === -1) ctx.scale(-1, 1);
  // コア
  ctx.fillStyle = '#00f0ff';
  ctx.shadowBlur = 18; ctx.shadowColor = '#00f0ff';
  ctx.fillRect(-10, -14, 20, 24);
  ctx.shadowBlur = 0;
  // ヘッド
  ctx.fillStyle = '#E8E8F0';
  ctx.fillRect(-8, -18, 16, 8);
  // 目
  ctx.fillStyle = '#ff007f';
  ctx.fillRect(2, -16, 6, 3);
  // 腕
  ctx.fillStyle = '#16213E';
  ctx.fillRect(-14, -10, 4, 14);
  ctx.fillRect(10, -10, 4, 14);
  // 脚
  ctx.fillStyle = '#16213E';
  ctx.fillRect(-8, 10, 6, 10);
  ctx.fillRect(2, 10, 6, 10);
  // ブースター噴射
  if (!player.onGround) {
    ctx.fillStyle = '#ffd700';
    ctx.globalAlpha = 0.6 + Math.random()*0.4;
    ctx.fillRect(-6, 20, 4, 6 + Math.random()*6);
    ctx.fillRect(2, 20, 4, 6 + Math.random()*6);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // 敵（敵フレーム）
  for (let e of enemies) {
    ctx.save();
    ctx.translate(e.x + e.w/2, e.y + e.h/2);
    ctx.fillStyle = '#ff007f';
    ctx.shadowBlur = 14; ctx.shadowColor = '#ff007f';
    ctx.beginPath();
    ctx.moveTo(0, -14);
    ctx.lineTo(12, 8);
    ctx.lineTo(-12, 8);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // 敵の目
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(-4, -6, 3, 3);
    ctx.fillRect(1, -6, 3, 3);
    ctx.restore();

    // HPバー
    let pct = Math.max(0, e.hp / e.maxHp);
    ctx.fillStyle = '#333355';
    ctx.fillRect(e.x, e.y - 10, e.w, 5);
    ctx.fillStyle = pct > 0.5 ? '#2ecc71' : pct > 0.25 ? '#f1c40f' : '#e74c3c';
    ctx.fillRect(e.x, e.y - 10, e.w * pct, 5);
  }

  // 弾丸
  ctx.fillStyle = '#ffd700';
  for (let b of bullets) {
    ctx.shadowBlur = 10; ctx.shadowColor = '#ffd700';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.shadowBlur = 0;
  }

  // ドロップ
  for (let d of drops) {
    ctx.fillStyle = d.color;
    ctx.shadowBlur = 12; ctx.shadowColor = d.color;
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#1A1A2E';
    ctx.font = 'bold 11px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(d.rank, d.x + d.w/2, d.y + d.h/2 + 4);
    ctx.textAlign = 'left';
  }

  // パーティクル
  for (let p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.life / 20);
    ctx.fillRect(p.x, p.y, p.size||3, p.size||3);
    ctx.globalAlpha = 1;
  }

  // ゲームオーバー
  if (player.hp <= 0) {
    ctx.fillStyle = 'rgba(26,26,46,0.85)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = '#ff007f'; ctx.font = 'bold 44px Arial'; ctx.textAlign = 'center';
    ctx.shadowBlur = 20; ctx.shadowColor = '#ff007f';
    ctx.fillText("FRAME DESTROYED", canvas.width/2, canvas.height/2 - 20);
    ctx.shadowBlur = 0;
    ctx.font = '18px Arial'; ctx.fillStyle = '#8888AA';
    ctx.fillText("F5 でリトライ", canvas.width/2, canvas.height/2 + 20);
    ctx.textAlign = 'left';
    return;
  }

  requestAnimationFrame(() => { update(); draw(); });
}

draw();
</script>
</body>
</html>
