<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>NOAH — Quiet Observatory v0.2 | GALACTICA ROOMS</title>
<style>
:root{
  --bg:#070a18; --panel:rgba(12,16,38,.78); --panel2:rgba(18,24,54,.68);
  --line:rgba(135,193,255,.18); --cyan:#78f2ff; --blue:#6f8cff; --vio:#9d7cff;
  --text:#eef6ff; --muted:#a9b7cf; --warm:#ffd6a8;
}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0,#111938,#070a18 62%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:12px;padding:14px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(20,26,60,.82),rgba(8,12,31,.76));backdrop-filter:blur(18px);box-shadow:0 18px 70px rgba(0,0,0,.28)}
.brand small{display:block;letter-spacing:.18em;color:#98a9ca;font-size:10px}.brand h1{font-size:20px;margin:3px 0 0;letter-spacing:.06em}.brand h1 span{font-weight:500;color:#b6c7e7}.status{display:flex;align-items:center;gap:9px;color:#b7c6de;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:#6bf0b1;box-shadow:0 0 18px #6bf0b1}
.main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
.stage{position:relative;min-height:0;border-radius:26px;overflow:hidden;border:1px solid var(--line);background:radial-gradient(circle at 50% 35%,#17234d 0,#0b1027 60%,#070914 100%);box-shadow:0 24px 80px rgba(0,0,0,.34)}
canvas{width:100%;height:100%;display:block;touch-action:none}
.heroCopy{position:absolute;left:22px;top:20px;max-width:420px;padding:14px 16px;border-radius:18px;background:linear-gradient(180deg,rgba(10,16,38,.74),rgba(10,14,30,.54));border:1px solid rgba(139,203,255,.15);backdrop-filter:blur(12px);pointer-events:none}.heroCopy strong{font-size:17px}.heroCopy p{margin:5px 0 0;color:#b9c7de;font-size:12px;line-height:1.55}
.modePill{position:absolute;right:18px;top:18px;padding:9px 12px;border-radius:999px;border:1px solid rgba(116,232,255,.25);background:rgba(7,14,35,.72);color:#9cefff;font-size:11px;letter-spacing:.08em}
.hint{position:absolute;right:18px;bottom:18px;padding:8px 11px;border-radius:999px;background:rgba(7,10,22,.65);border:1px solid rgba(255,255,255,.08);color:#9cabca;font-size:10px}
.side{min-height:0;overflow:auto;border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,rgba(15,20,46,.86),rgba(8,12,28,.82));padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.24)}
.profile{display:grid;grid-template-columns:54px 1fr;gap:11px;align-items:center;padding-bottom:14px;border-bottom:1px solid rgba(140,190,255,.12)}.avatarBadge{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#eaf8ff,#779aff 65%,#2c3569);box-shadow:0 0 30px rgba(112,205,255,.25);font-size:24px}.profile h2{margin:0;font-size:18px}.profile p{margin:3px 0 0;color:#9eb0cf;font-size:11px}
.block{margin-top:16px}.label{font-size:10px;letter-spacing:.16em;color:#7f95bb;margin-bottom:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button,.wideBtn{border:1px solid rgba(130,193,255,.14);background:rgba(22,30,64,.78);color:#d8e8ff;border-radius:14px;padding:10px 9px;cursor:pointer;transition:.18s}.grid button:hover,.wideBtn:hover{transform:translateY(-1px);border-color:rgba(128,226,255,.35);background:rgba(30,42,85,.9)}.grid button.active{background:linear-gradient(180deg,rgba(74,108,194,.9),rgba(44,68,142,.9));border-color:rgba(118,224,255,.4);box-shadow:0 0 24px rgba(73,163,255,.16)}
.wideBtn{width:100%}.info{padding:12px;border-radius:16px;background:rgba(19,28,60,.55);border:1px solid rgba(140,190,255,.1);font-size:11px;color:#aebdd6;line-height:1.65}
.bottom{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:20px;background:rgba(11,16,36,.82);backdrop-filter:blur(16px)}.nav{display:flex;gap:7px;overflow:auto}.nav button{white-space:nowrap;border:1px solid rgba(130,193,255,.12);background:rgba(20,28,58,.72);color:#c5d5ed;border-radius:12px;padding:9px 11px;cursor:pointer}.chat{display:flex;gap:8px;min-width:0}.chat input{min-width:0;flex:1;border:1px solid rgba(130,193,255,.14);background:rgba(7,11,26,.72);color:#eef7ff;border-radius:14px;padding:10px 13px;outline:none}.chat input:focus{border-color:rgba(118,225,255,.42)}.send{border:0;border-radius:14px;padding:10px 15px;background:linear-gradient(135deg,#6e7cff,#56d9f6);color:white;font-weight:700;cursor:pointer}.cin{border:1px solid rgba(130,193,255,.14);background:rgba(20,28,58,.72);color:#d0ddf2;border-radius:12px;padding:9px 12px;cursor:pointer}
@media(max-width:900px){#app{padding:8px;gap:8px}.main{grid-template-columns:1fr}.side{display:none}.bottom{grid-template-columns:1fr auto}.nav{grid-column:1/-1;order:2}.heroCopy{left:12px;top:12px;max-width:72%}.brand h1{font-size:17px}.status{display:none}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><small>GALACTICA ROOMS · RESIDENT 003</small><h1>NOAH <span>— Quiet Observatory</span></h1></div>
    <div class="status"><span class="dot"></span>noah online</div>
  </header>

  <main class="main">
    <section class="stage">
      <canvas id="c"></canvas>
      <div class="heroCopy"><strong id="speechTitle">NOAH</strong><p id="speech">ロドリン、おかえり＾＾　今日はどの星から見ようか？</p></div>
      <div class="modePill" id="modePill">OBSERVATORY MODE</div>
      <div class="hint">drag: look · wheel: zoom · click Noah: react</div>
    </section>

    <aside class="side">
      <div class="profile">
        <div class="avatarBadge">✦</div>
        <div><h2>ノア</h2><p>warm curiosity · quiet support</p></div>
      </div>
      <div class="block"><div class="label">EXPRESSIONS</div><div class="grid">
        <button data-act="idle" class="active">Idle</button><button data-act="think">Think</button>
        <button data-act="wave">Wave</button><button data-act="laugh">Laugh</button>
        <button data-act="observe">Observe</button><button data-act="excited">Excited</button>
      </div></div>
      <div class="block"><div class="label">ROOM SYSTEMS</div><div class="grid">
        <button data-cam="desk">Desk</button><button data-cam="window">Window</button>
        <button data-cam="bed">Sofa</button><button data-cam="shelf">Bookshelf</button>
      </div></div>
      <div class="block"><button class="wideBtn" id="eclipse">✦ ECLIPSE MODE</button></div>
      <div class="block"><div class="info">本棚＝記憶、窓＝観測、デスク＝作業、ホログラム球＝ATLAS。<br>部屋そのものをUIにする設計。</div></div>
    </aside>
  </main>

  <footer class="bottom">
    <div class="nav"><button data-cam="room">部屋全体</button><button data-cam="noah">ノアに近づく</button><button data-cam="desk">Desk</button><button data-cam="window">Window</button><button data-cam="shelf">Bookshelf</button></div>
    <div class="chat"><input id="chat" placeholder="ノアに話しかける…"/><button class="send" id="send">話す</button></div>
    <button class="cin" id="cinematic">◌ cinematic</button>
  </footer>
</div>

<script src="./bridge.js"></script>
<script type="module">
import * as THREE from './three.module.js';

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.22; renderer.shadowMap.enabled=true;
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x070b18,.018);
const camera=new THREE.PerspectiveCamera(38,1,.1,100); camera.position.set(6.6,4.2,8.8);

const C={navy:0x0d1535,navy2:0x151f49,blue:0x6f8cff,cyan:0x68eeff,vio:0x9378ff,white:0xf4f7ff,silver:0xdce6f4,warm:0xffd6a8,wood:0x6f4d3b,wood2:0x9d765d,green:0x4f8c68,dark:0x070a15};
const mat=(c,r=.6,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const em=(c,int=.35)=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:int,roughness:.45});

scene.add(new THREE.HemisphereLight(0x8fb9ff,0x1d1321,1.55));
const key=new THREE.DirectionalLight(0xffffff,2.6);key.position.set(6,8,6);key.castShadow=true;scene.add(key);
const warm=new THREE.PointLight(C.warm,3.4,8);warm.position.set(-3,3,2);scene.add(warm);
const cool=new THREE.PointLight(C.cyan,2.2,9);cool.position.set(4,3,-2);scene.add(cool);

// ROOM SHELL
const room=new THREE.Group();scene.add(room);
const floor=new THREE.Mesh(new THREE.BoxGeometry(8.8,.18,6.5),mat(0x44344c,.82));floor.position.y=-1.36;floor.receiveShadow=true;room.add(floor);
const rug=new THREE.Mesh(new THREE.CylinderGeometry(2.1,2.1,.045,64),mat(0x243066,.68));rug.position.set(.2,-1.24,.7);room.add(rug);
for(let i=0;i<3;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(1.0+i*.38,.018,10,80),em(0x637fff,.65));ring.rotation.x=Math.PI/2;ring.position.set(.2,-1.205,.7);room.add(ring)}
const back=new THREE.Mesh(new THREE.BoxGeometry(8.8,4.6,.16),mat(0x171a38,.93));back.position.set(0,.85,-3.18);room.add(back);
const leftWall=new THREE.Mesh(new THREE.BoxGeometry(.16,4.6,6.5),mat(0x12162f,.92));leftWall.position.set(-4.32,.85,0);room.add(leftWall);

// WINDOW with city & stars
const winFrame=new THREE.Mesh(new THREE.BoxGeometry(4.05,2.6,.18),mat(0x202a55,.35,.35));winFrame.position.set(1.7,1.25,-3.04);room.add(winFrame);
const win=new THREE.Mesh(new THREE.PlaneGeometry(3.72,2.28),new THREE.MeshBasicMaterial({color:0x07152e}));win.position.set(1.7,1.25,-2.94);room.add(win);
const stars=new THREE.Group();room.add(stars);
for(let i=0;i<95;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.012+Math.random()*.02,8,8),new THREE.MeshBasicMaterial({color:Math.random()>.2?0xccecff:0x8ba8ff}));s.position.set(.0+Math.random()*3.5, .25+Math.random()*2.0,-2.91);stars.add(s)}
for(let i=0;i<24;i++){const h=.18+Math.random()*.75;const b=new THREE.Mesh(new THREE.BoxGeometry(.11+Math.random()*.16,h,.05),mat(0x162447,.72));b.position.set(.0+Math.random()*3.5,.13+h/2,-2.90);room.add(b);for(let w=0;w<3;w++){if(Math.random()>.45){const l=new THREE.Mesh(new THREE.BoxGeometry(.018,.025,.01),em(0xffd993,.65));l.position.set(b.position.x+((Math.random()-.5)*.09),b.position.y+((Math.random()-.5)*h*.65),-2.86);room.add(l)}}}
const moon=new THREE.Mesh(new THREE.SphereGeometry(.22,32,24),em(0x9cbaff,.3));moon.position.set(2.5,1.75,-2.87);room.add(moon);

// DESK
const desk=new THREE.Group();desk.position.set(-2.5,-.56,-.35);room.add(desk);
const top=new THREE.Mesh(new THREE.BoxGeometry(3.15,.16,1.22),mat(C.wood2,.72));top.castShadow=true;desk.add(top);
for(const x of [-1.35,1.35])for(const z of [-.46,.46]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.12,1.25,.12),mat(C.wood,.8));leg.position.set(x,-.68,z);desk.add(leg)}
const monitor=new THREE.Mesh(new THREE.BoxGeometry(1.75,1.02,.12),mat(0x11182f,.4,.2));monitor.position.set(-.35,.72,-.22);desk.add(monitor);
const screen=new THREE.Mesh(new THREE.PlaneGeometry(1.55,.82),em(0x173f74,.55));screen.position.set(-.35,.72,-.151);desk.add(screen);
const screenText=[];for(let i=0;i<6;i++){const bar=new THREE.Mesh(new THREE.BoxGeometry(.68-.07*i,.035,.01),em(i%2?C.cyan:C.blue,.75));bar.position.set(-.48,.92-i*.115,-.14);desk.add(bar)}
const keyboard=new THREE.Mesh(new THREE.BoxGeometry(1.05,.06,.34),mat(0xe9eef7,.5));keyboard.position.set(-.55,.12,.18);desk.add(keyboard);
const pc=new THREE.Mesh(new THREE.BoxGeometry(.44,.74,.42),mat(0x101831,.32,.35));pc.position.set(1.16,-.28,-.2);desk.add(pc);const pcGlow=new THREE.Mesh(new THREE.BoxGeometry(.25,.5,.01),em(C.cyan,.7));pcGlow.position.set(1.16,-.28,.02);desk.add(pcGlow);
const mug=new THREE.Mesh(new THREE.CylinderGeometry(.15,.13,.23,24),mat(0x182341,.45));mug.position.set(.55,.2,.18);desk.add(mug);

// BOOKSHELF
const shelf=new THREE.Group();shelf.position.set(3.35,-.08,-1.0);room.add(shelf);
const shell=new THREE.Mesh(new THREE.BoxGeometry(1.15,2.9,.62),mat(0x76533f,.76));shelf.add(shell);
for(let y=-1.0;y<=1.0;y+=.67){const plank=new THREE.Mesh(new THREE.BoxGeometry(1.0,.07,.55),mat(0xa47c61,.72));plank.position.set(0,y,0);shelf.add(plank)}
const bookColors=[0x5c6d9b,0x8c6d8b,0x445680,0x9c7d68,0x647d89];
for(let r=0;r<4;r++)for(let i=0;i<5;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(.12,.36,.36),mat(bookColors[(r+i)%bookColors.length],.8));b.position.set(-.35+i*.17,-.7+r*.67,.02);shelf.add(b)}
const orb=new THREE.Mesh(new THREE.SphereGeometry(.16,24,20),em(C.cyan,.8));orb.position.set(.25,1.16,.08);shelf.add(orb);

// BED / SOFA
const bed=new THREE.Group();bed.position.set(2.2,-.55,1.45);room.add(bed);
const base=new THREE.Mesh(new THREE.BoxGeometry(2.7,.48,1.45),mat(0x26345f,.8));base.castShadow=true;bed.add(base);
const mattress=new THREE.Mesh(new THREE.BoxGeometry(2.55,.32,1.32),mat(0x8c86aa,.93));mattress.position.y=.34;bed.add(mattress);
const blanket=new THREE.Mesh(new THREE.BoxGeometry(2.35,.09,.95),mat(0x6272a5,.92));blanket.position.set(.05,.54,.08);bed.add(blanket);
for(let i=0;i<2;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.62,.34,.24),mat(i?0x1c244b:0x8e94ba,.9));p.position.set(-.7+i*.75,.7,-.46);bed.add(p)}

// plants
function plant(x,z,s=1){const g=new THREE.Group();g.position.set(x,-1.18,z);const pot=new THREE.Mesh(new THREE.CylinderGeometry(.22,.18,.35,20),mat(0x9b728b,.7));pot.position.y=.17;g.add(pot);for(let i=0;i<7;i++){const leaf=new THREE.Mesh(new THREE.SphereGeometry(.16,16,12),mat(0x4d8f70,.9));leaf.scale.set(.55,1.2,.35);leaf.position.set((Math.random()-.5)*.35,.45+Math.random()*.5,(Math.random()-.5)*.3);leaf.rotation.z=(Math.random()-.5)*1.2;g.add(leaf)}g.scale.setScalar(s);room.add(g)}
plant(-3.75,1.7,.85);plant(3.8,1.9,1.1);

// NOAH AVATAR
const noah=new THREE.Group();noah.position.set(.15,-.15,.65);scene.add(noah);
const skin=mat(0xffe8d9,.68), hair=mat(0xe8ecff,.58), hair2=mat(0xcfd9ff,.62), dark=mat(0x141a36,.45,.12), white=mat(0xf7f9ff,.55), cyan=em(C.cyan,.55), iris=em(0x64dfff,.95);
const head=new THREE.Mesh(new THREE.SphereGeometry(.74,48,36),skin);head.scale.set(1,.94,.93);head.position.y=.92;head.castShadow=true;noah.add(head);
// FULL FLUFFY HAIR v0.2 — no exposed scalp, no bowl-cut helmet
// Back mass stays behind the face so the silhouette reads as hair, not a bald head.
const backHair=new THREE.Mesh(new THREE.SphereGeometry(.86,56,42),hair);
backHair.scale.set(1.05,.98,.67);backHair.position.set(0,1.01,-.20);backHair.castShadow=true;noah.add(backHair);

// Crown volume. Kept shallow in Z so it wraps the forehead without covering the eyes.
const crown=new THREE.Mesh(new THREE.SphereGeometry(.78,48,36,0,Math.PI*2,0,Math.PI*.56),hair2);
crown.scale.set(1.02,1.02,.70);crown.rotation.x=.10;crown.position.set(0,1.20,.02);crown.castShadow=true;noah.add(crown);

function hairTuft(x,y,z,sx,sy,sz,rz=0,ry=0,m=hair){
  const q=new THREE.Mesh(new THREE.SphereGeometry(.24,28,22),m);
  q.scale.set(sx,sy,sz);q.position.set(x,y,z);q.rotation.z=rz;q.rotation.y=ry;q.castShadow=true;noah.add(q);return q;
}

// Side + back locks: these are the pieces missing in v0.1 that made Noah look bald from 3/4 view.
hairTuft(-.67,1.08,.02,.78,1.65,.75, .18,-.18,hair);
hairTuft( .67,1.08,.02,.78,1.65,.75,-.18, .18,hair);
hairTuft(-.61,.77,-.05,.76,1.55,.72, .34,-.20,hair2);
hairTuft( .61,.77,-.05,.76,1.55,.72,-.34, .20,hair2);
hairTuft(-.40,.55,-.22,.85,1.30,.76, .42,-.25,hair);
hairTuft( .40,.55,-.22,.85,1.30,.76,-.42, .25,hair);

// Soft front fringe, five overlapping tufts with gaps for the eyes.
const fringeXs=[-.40,-.20,0,.20,.40];
fringeXs.forEach((x,i)=>{
  const q=hairTuft(x,1.24,.51,.50,.95,.34,(x*-.55),0,i%2?hair2:hair);
  q.position.y -= Math.abs(x)*.09;
});
// Face-framing locks
hairTuft(-.53,.93,.48,.48,1.18,.34, .25,-.08,hair2);
hairTuft( .53,.93,.48,.48,1.18,.34,-.25, .08,hair2);

// A small lifted crown tuft prevents a smooth helmet silhouette.
hairTuft(-.18,1.62,.05,.48,.70,.42, .42,-.10,hair2);
hairTuft( .16,1.66,.02,.44,.72,.40,-.36, .10,hair);

const ahogeCurve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-.04,1.67,.06),new THREE.Vector3(.02,1.93,.05),
  new THREE.Vector3(.22,2.03,.01),new THREE.Vector3(.35,1.89,-.02),
  new THREE.Vector3(.28,1.79,-.01)
]);
const ahoge=new THREE.Mesh(new THREE.TubeGeometry(ahogeCurve,32,.045,10,false),hair2);noah.add(ahoge);
// eyes
for(const x of [-.26,.26]){const w=new THREE.Mesh(new THREE.SphereGeometry(.125,24,20),white);w.scale.set(1,1.28,.48);w.position.set(x,.96,.66);noah.add(w);const e=new THREE.Mesh(new THREE.SphereGeometry(.072,20,16),iris);e.scale.set(.9,1.18,.42);e.position.set(x,.96,.75);noah.add(e)}
const mouth=new THREE.Mesh(new THREE.TorusGeometry(.1,.018,10,28,Math.PI),new THREE.MeshBasicMaterial({color:0x7d4d68}));mouth.rotation.x=Math.PI;mouth.position.set(0,.71,.72);noah.add(mouth);
// body hoodie
const torso=new THREE.Mesh(new THREE.SphereGeometry(.52,36,28),dark);torso.scale.set(.9,1.02,.72);torso.position.y=.05;torso.castShadow=true;noah.add(torso);
const hood=new THREE.Mesh(new THREE.TorusGeometry(.48,.10,16,40,Math.PI*1.5),white);hood.rotation.z=.78;hood.position.set(0,.43,-.02);noah.add(hood);
const chest=new THREE.Mesh(new THREE.OctahedronGeometry(.10),cyan);chest.position.set(0,.13,.43);chest.rotation.z=Math.PI/4;noah.add(chest);
// arms/legs
function capsule(r,l,color){return new THREE.Mesh(new THREE.CapsuleGeometry(r,l,10,18),color)}
const armL=capsule(.13,.48,white),armR=capsule(.13,.48,white);armL.position.set(-.47,.08,.03);armR.position.set(.47,.08,.03);armL.rotation.z=.15;armR.rotation.z=-.15;noah.add(armL,armR);
const legL=capsule(.14,.43,dark),legR=capsule(.14,.43,dark);legL.position.set(-.22,-.62,.05);legR.position.set(.22,-.62,.05);noah.add(legL,legR);
for(const x of [-.22,.22]){const shoe=new THREE.Mesh(new THREE.SphereGeometry(.19,24,18),white);shoe.scale.set(1.1,.62,1.45);shoe.position.set(x,-.96,.18);noah.add(shoe);const sole=new THREE.Mesh(new THREE.BoxGeometry(.26,.04,.18),cyan);sole.position.set(x,-1.05,.31);noah.add(sole)}
// hair clip
const clip=new THREE.Mesh(new THREE.TorusGeometry(.11,.025,8,3),cyan);clip.rotation.z=.55;clip.position.set(.55,1.31,.47);noah.add(clip);
// floating companion orb
const buddy=new THREE.Group();buddy.position.set(.92,.35,.7);scene.add(buddy);const orbBody=new THREE.Mesh(new THREE.SphereGeometry(.22,28,22),mat(0x1c2b58,.35,.18));buddy.add(orbBody);const face=new THREE.Mesh(new THREE.PlaneGeometry(.22,.11),em(C.cyan,.9));face.position.z=.205;buddy.add(face);

// atlas holo sphere
const atlas=new THREE.Group();atlas.position.set(-1.0,.7,-.8);room.add(atlas);const globe=new THREE.Mesh(new THREE.SphereGeometry(.3,24,18),new THREE.MeshBasicMaterial({color:0x2c5eff,wireframe:true,transparent:true,opacity:.55}));atlas.add(globe);const glow=new THREE.PointLight(C.cyan,1.2,2.5);atlas.add(glow);

// stars ambient particles
const dustGeo=new THREE.BufferGeometry();const pts=[];for(let i=0;i<160;i++)pts.push((Math.random()-.5)*12,Math.random()*7-1.5,(Math.random()-.5)*12);dustGeo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0x7eaaff,size:.018,transparent:true,opacity:.55}));scene.add(dust);

let action='idle', eclipse=false, t=0;const speech=document.getElementById('speech'),pill=document.getElementById('modePill');
const actions={idle:'ロドリン、おかえり＾＾　今日はどの星から見ようか？',think:'うーん……この構造、もう一段おもしろくできそう（笑）',wave:'やっほおおおお＾＾',laugh:'ふふふふふ（笑）それ最高だよ🤣',observe:'東方宙域を観測中。少し気になる動きがある。',excited:'それだああああああ🤣🔥'};
function setAction(a){action=a;speech.textContent=actions[a];document.querySelectorAll('[data-act]').forEach(b=>b.classList.toggle('active',b.dataset.act===a));}
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>setAction(b.dataset.act));

const poses={room:{p:[6.6,4.2,8.8],l:[0,.45,0]},noah:{p:[2.3,1.4,4.3],l:[0,.55,.5]},desk:{p:[-4.4,2.5,4.7],l:[-2.2,.25,-.2]},window:{p:[4.7,2.8,5.5],l:[1.7,1.3,-3]},bed:{p:[4.4,1.7,4.5],l:[2.2,.1,1.4]},shelf:{p:[5.8,2.5,2.6],l:[3.3,.5,-.9]}};
let camTarget='room';document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>camTarget=b.dataset.cam);

document.getElementById('eclipse').onclick=()=>{eclipse=!eclipse;pill.textContent=eclipse?'ECLIPSE MODE':'OBSERVATORY MODE';speech.textContent=eclipse?'ECLIPSE MODE。観測レイヤーを深度3へ。':'通常観測モードへ戻ったよ＾＾';renderer.toneMappingExposure=eclipse?1.05:1.22;cool.intensity=eclipse?4.2:2.2;};

document.getElementById('send').onclick=()=>{const v=document.getElementById('chat').value.trim();if(!v)return;speech.textContent='うん、聞いてるよ＾＾「'+v+'」';document.getElementById('chat').value='';setAction('idle')};

// ===== Resident hooks (ノア指定3要素) =====
window.NOAH_ROOM_API={
setAction(a){if(actions[a])setAction(a)},
setEmotion(e){/* v0.3 で感情パラメータ展開 (excited→発光強化等) */},
receive(text){speech.textContent=String(text);},
focus(cam){camTarget=cam in poses?cam:'room'},
get meta(){return window.NOAH_ROOM_BRIDGE?.meta}
};

let uiHidden=false;document.getElementById('cinematic').onclick=()=>{uiHidden=!uiHidden;document.querySelector('.topbar').style.display=uiHidden?'none':'flex';document.querySelector('.side').style.display=uiHidden?'none':'';document.querySelector('.bottom').style.display=uiHidden?'none':'grid';document.querySelector('.heroCopy').style.display=uiHidden?'none':'block';document.getElementById('app').style.gridTemplateRows=uiHidden?'1fr':'auto 1fr auto';document.querySelector('.main').style.gridTemplateColumns=uiHidden?'1fr':'minmax(0,1fr) 280px';};

let dragging=false,lastX=0,lastY=0,yaw=0,pitch=0,zoom=0;canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});window.addEventListener('pointerup',()=>dragging=false);window.addEventListener('pointermove',e=>{if(!dragging)return;yaw+=(e.clientX-lastX)*.004;pitch=Math.max(-.5,Math.min(.5,pitch+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY;camTarget='free'});canvas.addEventListener('wheel',e=>{zoom=Math.max(-2.8,Math.min(3.2,zoom+e.deltaY*.004));if(camTarget!=='free')camTarget='free'},{passive:true});canvas.addEventListener('click',()=>setAction(action==='excited'?'idle':'excited'));

function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);resize();

function animate(){requestAnimationFrame(animate);t+=.016;
  if(camTarget==='free'){const rad=9+zoom;camera.position.x=Math.sin(yaw)*rad;camera.position.z=Math.cos(yaw)*rad;camera.position.y=3.0+pitch*3;camera.lookAt(0,.3,0)}else{const q=poses[camTarget]||poses.room;camera.position.lerp(new THREE.Vector3(...q.p),.06);const look=new THREE.Vector3(...q.l);camera.lookAt(look)}
  // idle life
  noah.position.y=-.15+Math.sin(t*1.8)*.018;head.scale.y=.94+Math.sin(t*1.8)*.008;buddy.position.y=.35+Math.sin(t*2.2)*.07;buddy.rotation.y+=.01;atlas.rotation.y+=.004;stars.rotation.y+=.00025;
  // blink
  const blink=Math.sin(t*.72)>0.992?.13:1;noah.children.filter(o=>o.material===iris).forEach(e=>e.scale.y=blink);
  // action poses reset then apply
  armL.rotation.z=.15;armR.rotation.z=-.15;noah.rotation.z*=.88;noah.rotation.y*=.88;
  if(action==='think'){armR.rotation.z=-1.25;noah.rotation.z=-.04}
  if(action==='wave'){armR.rotation.z=-1.7+Math.sin(t*7)*.22}
  if(action==='laugh'){noah.rotation.z=Math.sin(t*6)*.045}
  if(action==='observe'){noah.rotation.y=.28+Math.sin(t*.8)*.03;globe.rotation.y+=.03}
  if(action==='excited'){armL.rotation.z=1.05;armR.rotation.z=-1.05;noah.position.y+=Math.abs(Math.sin(t*5))*.08}
  if(eclipse){dust.material.opacity=.9;globe.material.opacity=.85}else{dust.material.opacity=.55;globe.material.opacity=.55}
  renderer.render(scene,camera)}animate();
</script>
</body>
</html>
